<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Карта</title>
<style>
  :root { color-scheme: dark light; --bg:#0f1115; --fg:#e8e8ea; --muted:#9aa0a6; --card:#181b21; --line:#2a2f38; --accent:#4f8cff; --bad:#ff6b6b; }
  @media (prefers-color-scheme: light) { :root { --bg:#f6f7f9; --fg:#16181d; --muted:#5f6670; --card:#ffffff; --line:#d9dde3; --accent:#2563eb; --bad:#c62828; } }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; }
  .card { width: 100%; max-width: 360px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
  h1 { font-size: 17px; margin: 0 0 6px; }
  p { margin: 0 0 14px; color: var(--muted); }
  input { width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line);
          background: var(--bg); color: var(--fg); font: inherit; }
  button { margin-top: 10px; width: 100%; padding: 10px 12px; border: 0; border-radius: 8px; background: var(--accent);
           color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  #err { color: var(--bad); margin: 10px 0 0; min-height: 1.2em; }
  #wait { color: var(--muted); }
</style>
</head>
<body>
<div class="card" id="box">
  <p id="wait">Відкриваю…</p>
  <form id="form" hidden>
    <h1>Потрібен ключ</h1>
    <p>Відкрийте повне посилання, яке вам надіслали, або вставте ключ сюди.</p>
    <input id="k" autocomplete="off" spellcheck="false" placeholder="ключ">
    <button type="submit">Відкрити</button>
    <p id="err"></p>
  </form>
</div>

function bytes(s) {
  s = s.trim().replace(/-/g, "+").replace(/_/g, "/").replace(/\s+/g, "");
  while (s.length % 4) s += "=";
  const bin = atob(s); const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

    document.head.appendChild(s);
  });
}

(async () => {
